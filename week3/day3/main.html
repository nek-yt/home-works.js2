<!DOCTYPE html>
<html lang="en">
<head>

            <input type="text" name="salary">

            </select>
            <button class="aBtn">Add</button>
            <button class="x">x</button>
        </form>
    </dialog>
    <dialog class="editD">

            <input type="text" name="profileD">
            <input type="text" name="nameD">

    <table>

                <th>Job</th>
                <th>Salary</th>
